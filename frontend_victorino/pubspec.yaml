name: frontend_victorino
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.

  cupertino_icons: ^1.0.8
  # Iconos oficiales de Apple (estilo iOS).
  # Aunque tu app sea Android/Web, estos iconos son estándar en Flutter
  # y se usan para botones, barras de navegación, ajustes, etc.

  http: ^1.6.0
  # Permite hacer peticiones HTTP al backend Spring Boot.
  # Lo usarás para login, registro, obtener servicios, citas, empleados, etc.

  intl: ^0.20.2
  # Manejo profesional de fechas, horas y formatos.
  # Imprescindible para un sistema de citas como Victorino Style.

  flutter_secure_storage: ^10.0.0 # Guarda datos sensibles de forma segura (como el token JWT).

  google_fonts: ^8.0.2 # Permite usar tipografías modernas de Google

  flutter_svg: ^2.2.4 # Permite cargar iconos y gráficos SVG (vectoriales).
  # Ideal para logo, iconos personalizados y diseños escalables.

  lottie: ^3.3.3 # Permite usar animaciones Lottie (JSON). Perfecto para pantallas de carga, onboarding, éxito/error, etc.

  flex_color_scheme: ^8.4.0 # Sistema avanzado para crear temas profesionales (colores, modos claro/oscuro).
  # Facilita mantener un diseño consistente entre los 3

  card_swiper: ^3.0.1 # Carruseles de tarjetas (swipe horizontal). Útil para mostrar servicios, promociones, estilos de corte, etc.

  flutter_form_builder: ^10.3.0+2 # Crea formularios avanzados con validaciones automáticas.
  # Ideal para login, registro, crear citas, editar perfil, etc.

  flutter_riverpod: ^3.3.1 # Sistema moderno de gestión de estado para Flutter.
  # Permite separar la lógica de la UI, manejar estados reactivos y asincrónicos
  # (loading, error, data) de forma segura y escalable. Ideal para apps grandes
  # como la de Victorino Style, donde necesitas control limpio del estado,
  # peticiones HTTP, formularios, autenticación y más.

  fl_chart: ^1.2.0 # para los graficos profesionaless

  syncfusion_flutter_charts: ^33.1.49 # para los graficos

  go_router: ^17.2.2 # Manejo profesional de rutas y navegación.
  # Permite crear rutas limpias y bien estructuradas, manejar la navegación entre pantallas,
  # redirecciones, estados de autenticación y más, de forma profesional y escalable.

  dio: ^5.9.2 # Cliente HTTP potente y flexible para peticiones HTTP.
  # Ideal para hacer requests al backend, interceptar respuestas, manejar errores, etc.

  url_launcher: ^6.3.2 # Permite abrir enlaces externos (sitio web, WhatsApp, redes sociales, etc.) desde la app.
  # Ideal para poner enlaces en el perfil del barbero, en los detalles de un servicio, etc.

  otp_autofill: ^4.1.0 # Autocompletado inteligente de códigos OTP (One-Time Password).
  # Detecta automáticamente el código SMS entrante y lo inserta en el campo, mejorando la experiencia de verificación.

  image_picker: ^1.1.2 # Selector de imágenes desde galería/cámara.
  # Necesario para subir la foto del empleado, servicio o perfil del cliente.

  image_editor_plus: ^1.0.8 # Editor de imágenes avanzado.
  # Permite aplicar filtros, dibujar, agregar texto, stickers y otras herramientas de edición.

  image_cropper: ^12.2.1 # Recortador de imágenes.
  # Abre una interfaz para recortar la imagen seleccionada antes de guardarla o subirla.

  crop_your_image: ^2.0.0 # Alternativa para recortar imágenes.
  # Ofrece un widget personalizable para recortar imágenes dentro de tu propia UI.




  # *****************************  CALENDARIOS*******************
  infinite_calendar_view: ^2.11.3 # Calendario infinito desplazable.
  # Permite navegar por meses y años sin límite, con scroll suave y personalizable.

  adoptive_calendar: ^0.2.0 # Calendario adaptable al diseño.
  # Se ajusta automáticamente al tamaño disponible y permite estilos modernos y minimalistas.

  cupertino_calendar_picker: ^2.2.6 # Selector de fecha estilo iOS.
  # Muestra el clásico "ruedita" de Apple para elegir fecha y hora, ideal para apps con estilo Cupertino.

  syncfusion_flutter_calendar: ^33.2.5 # Calendario profesional y muy completo.
  # Incluye vistas de día, semana, mes, agenda, eventos, recordatorios, arrastrar y soltar, etc.
  # Perfecto para apps de reservas, agendas o gestión de horarios.

  easy_date_timeline: ^2.0.9 # Línea de fechas horizontal.
  # Muestra una tira de días desplazable, útil para seleccionar fechas rápidas tipo "timeline".

  flutter_datetime_picker: ^1.5.1 # Selector de fecha y hora simple.
  # Ofrece un picker rápido y personalizable para elegir fechas, horas o ambos.


  #Firebase Notificaciones Push
  firebase_core: ^3.6.0          # Esto es para la inicialización base de Firebase (requerido por todos los paquetes Firebase).
  firebase_messaging: ^15.1.3    # Esto es para recibir y gestionar notificaciones push en primer y segundo plano (el FCM).
  flutter_local_notifications: ^21.0.0  # Esto es para mostrar notificaciones locales cuando la app está siendo utilizada en ese preciso momento por el usuario (foreground).



dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Mocktail: librería para mockear dependencias en tests sin code-gen.
  # Se usa en los tests del caso de uso IniciarSesion.
  mocktail: ^1.0.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  assets:
    - assets/
    - assets/logos_app/
    - assets/imagenes/

#flutter:
#  assets:
#    - assets/
#Esto hace que Flutter incluya todoos el contenido dentro de assets/, incluyendo subcarpetas como:
#
#assets/
# ├── logos/
# ├── imagenes/
# ├── icono/
# ├── logos_app/


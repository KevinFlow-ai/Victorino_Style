# Configuración del splash nativo (nivel de plataforma, antes de que Flutter arranque).
# Fondo: salmón rosado #E8A898
# Logo centrado: assets/logos_app/logo_app1.3.png
# Ejecutar con: dart run flutter_native_splash:create

flutter_native_splash:
  color: "#E8A898"
  image: assets/logos_app/logo_app1.3.png

  color_dark: "#E8A898"
  image_dark: assets/logos_app/logo_app1.3.png

  # ── Android 12+ (SplashScreen API) ───────────────────────────────────────
  android_12:
    color: "#E8A898"
    image: assets/logos_app/logo_app1.3.png
    color_dark: "#E8A898"
    image_dark: assets/logos_app/logo_app1.3.png
    icon_background_color: "#E8A898"
    icon_background_color_dark: "#E8A898"

  # ── Plataformas activas ───────────────────────────────────────────────────
  android: true
  ios: true
  web: true
  # Linux no está soportado por flutter_native_splash

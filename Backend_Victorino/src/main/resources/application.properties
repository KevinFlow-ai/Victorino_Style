# ===============================
#  APP CONFIG
# ===============================
spring.application.name=Backend_Victorino
# ===============================
#  SERVER CONFIG
# ===============================
# Railway inyecta la variable PORT automaticamente. En local cae al 8080 por defecto.
server.port=${PORT:8080}
# ===============================
#  DATABASE CONFIG
# ===============================
# En local conecta al MySQL de la maquina. En Railway se sobreescribe con las
# variables del plugin MySQL (SPRING_DATASOURCE_URL/USERNAME/PASSWORD).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/victorino_style_bbdd_tfg_2dam_2025_2026_puig?useSSL=false&serverTimezone=Europe/Madrid&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ===============================
#  JPA / HIBERNATE CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ===============================
#  LOGGING CONFIG
# ===============================
logging.level.org.springframework=INFO
logging.level.org.victorino_style=DEBUG
# ===============================
#  ARCHIVOS ESTATICOS (uploads)
# ===============================
# El directorio de uploads se parametriza para poder apuntar al volumen
# persistente de Railway (/app/uploads). En local cae a la carpeta "uploads/"
# relativa al working directory del proceso Spring Boot.
spring.web.resources.static-locations=file:${VICTORINO_UPLOADS_DIRECTORIO:uploads}/
spring.mvc.static-path-pattern=/uploads/**
# ===============================
#  CONTEXTO DE LA API
# ===============================
server.servlet.context-path=/api/v1
# ===============================
#  JWT CONFIG
# ===============================
# La secret debe ir SIEMPRE por variable de entorno en produccion.
# El default solo sirve para desarrollo local: NO usarlo en Railway.
victorino.jwt.secret=${VICTORINO_JWT_SECRET:Y2FtYmlhbWVlbnByb2R1Y2Npb25fY2xhdmVfc2VjcmV0YV92aWN0b3Jpbm9fc3R5bGVfMjAyNg==}
victorino.jwt.access-ttl=PT15M
victorino.jwt.refresh-ttl=P7D
victorino.jwt.issuer=victorino-style
# ===============================
#  ADMIN DE PRUEBA (DEV)
# ===============================
victorino.admin-prueba.activo=${VICTORINO_ADMIN_PRUEBA_ACTIVO:true}
victorino.admin-prueba.correo=${VICTORINO_ADMIN_PRUEBA_CORREO:victorino@admin.com}
victorino.admin-prueba.password=${VICTORINO_ADMIN_PRUEBA_PASSWORD:Admin1234!}
victorino.admin-prueba.nombre=Victorino
victorino.admin-prueba.apellidos=Admin
victorino.admin-prueba.foto=/uploads/empleados/admin.png
# ===============================
#  UPLOADS Y MULTIPART
# ===============================
victorino.uploads.directorio=${VICTORINO_UPLOADS_DIRECTORIO:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# ===============================
#  AVISOS DE CANCELACIONES FRECUENTES
# ===============================
victorino.avisos.umbral-cancelaciones=3
# ===============================
#  CORS
# ===============================
# Lista separada por coma de origenes adicionales permitidos por CORS.
# En Railway se pone aqui la URL del frontend (ej. https://victorino-frontend.up.railway.app).
victorino.cors.origenes-extra=${VICTORINO_CORS_ORIGENES_EXTRA:}
# ===============================
#  MAIL CONFIG (fallback cuando no hay SMTP configurado en BD)
# ===============================
# Para Gmail usa la contrasena de aplicacion (no la contrasena normal).
# El admin puede sobreescribir estos valores desde el panel de administracion
# en "Configuracion del negocio > Configuracion de correo".
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:peluqueria.victorinostyle@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:ysknifmendkfrwig}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Confiar en el certificado SSL de CUALQUIER servidor SMTP.
# Necesario con JDK 21 de Microsoft para evitar SSLHandshakeException.
# El "*" permite usar Gmail, Outlook, educaMadrid o cualquier proveedor.
spring.mail.properties.mail.smtp.ssl.trust=*
# ===============================
#  FIREBASE CLOUD MESSAGING
# ===============================
# Hay DOS formas de pasarle las credenciales al backend (FirebaseConfig las
# prueba en este orden, usa la primera que tenga contenido):
#
#  1) VICTORINO_FIREBASE_CREDENTIALS_JSON: el JSON entero del service account
#     como variable de entorno. Recomendado en cloud (Railway, Heroku...)
#     donde no se pueden montar ficheros. Ejemplo de uso en Railway:
#       VICTORINO_FIREBASE_CREDENTIALS_JSON={"type":"service_account",...}
#
#  2) VICTORINO_FIREBASE_CREDENTIALS_PATH: ruta tipo Spring Resource al JSON.
#     Recomendado en local (classpath:firebase/victorino-firebase-key.json).
#
# Si ninguna esta presente, push FCM queda deshabilitado pero la app arranca.
victorino.firebase.credentials-json=${VICTORINO_FIREBASE_CREDENTIALS_JSON:}
victorino.firebase.credentials-path=${VICTORINO_FIREBASE_CREDENTIALS_PATH:classpath:firebase/victorino-firebase-key.json}
victorino.firebase.project-id=${VICTORINO_FIREBASE_PROJECT_ID:victorino-style}

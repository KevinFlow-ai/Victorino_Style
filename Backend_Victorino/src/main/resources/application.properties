# ===============================
#  APP CONFIG
# ===============================
spring.application.name=Backend_Victorino

# ===============================
#  SERVER CONFIG
# ===============================
server.port=8080
server.error.include-message=always

# ===============================
#  DATABASE CONFIG
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/victorino_style_bbdd_tfg_2dam_2025_2026_puig?useSSL=false&serverTimezone=Europe/Madrid&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
#  JPA / HIBERNATE CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=update
# Mostrar las consultas SQL en consola
spring.jpa.show-sql=true

# Formatear las consultas SQL Para que las consultas se vean más bonita
spring.jpa.properties.hibernate.format_sql=true



# ¿Qué es spring.jpa.hibernate.ddl-auto?
# Es una propiedad de Spring Boot que le dice a Hibernate qué hacer con el esquema de la base de datos (tablas, columnas,
# relaciones) cada vez que arranca la aplicación.
# En otras palabras: controla si Hibernate crea, modifica, válida o ignora la estructura de la base de datos.
# Aquí se puede poner create-drop | create | update | validate | none

# create: Cada vez que arranca: borra todas las tablas y crea todoo desde cero. El riesgo borra datos
# create-drop: igual que create, pero al cerrar la aplicación, borra las tablas... El riesgo borra datos
# update: Hibérnate actualiza la base de datos automáticamente para que coincida con tus entidades:. Puede romper el esquema
# validate: Hibérnate solo comprueba que las entidades coinciden con la estructura de la base de datos.
# none: Hibérnate no toca la base de datos. Ideal cuando ya tienes el esquema creado manualmente o por migraciones




# ===============================
#  LOGGING CONFIG
# ===============================
logging.level.org.springframework=INFO
logging.level.org.victorino_style=DEBUG



# Permitir servir archivos desde la carpeta /uploads/
# Esto le dice a Spring Boot: Busca archivos estáticos en la carpeta uploads Hazlos accesibles desde la URL
spring.web.resources.static-locations=file:uploads/
spring.mvc.static-path-pattern=/uploads/**

# ===============================
#  CONTEXTO DE LA API
# ===============================
# Toda la API queda bajo /api/v1 (ej: POST /api/v1/auth/login).
server.servlet.context-path=/api/v1

# ===============================
#  JWT CONFIG
# ===============================
# IMPORTANTE: en producción esta clave debe ir en variable de entorno (VICTORINO_JWT_SECRET)
# La clave debe estar en base64 y tener al menos 256 bits (32 bytes) para HS256.
# Aquí va una clave de ejemplo SOLO para desarrollo local.
victorino.jwt.secret=Y2FtYmlhbWVlbnByb2R1Y2Npb25fY2xhdmVfc2VjcmV0YV92aWN0b3Jpbm9fc3R5bGVfMjAyNg==
# Duración del access token: 15 minutos (formato ISO-8601 Duration: PT15M).
victorino.jwt.access-ttl=PT15M
# Duración del refresh token: 7 días (P7D).
victorino.jwt.refresh-ttl=P7D
# Emisor del JWT (claim "iss"). Sirve para validar que el token lo emitimos nosotros.
victorino.jwt.issuer=victorino-style

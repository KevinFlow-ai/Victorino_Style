# ===============================
# IMPORTANTE: en producción esta clave debe ir en variable de entorno (VICTORINO_JWT_SECRET)
# La clave debe estar en base64 y tener al menos 256 bits (32 bytes) para HS256.
# Aquí va una clave de ejemplo SOLO para desarrollo local.
victorino.jwt.secret=Y2FtYmlhbWVlbnByb2R1Y2Npb25fY2xhdmVfc2VjcmV0YV92aWN0b3Jpbm9fc3R5bGVfMjAyNg==
# Duración del access token: 15 minutos (formato ISO-8601 Duration: PT15M).
victorino.jwt.access-ttl=PT15M
# Duración del refresh token: 7 días (P7D).
victorino.jwt.refresh-ttl=P7D
# Emisor del JWT (claim "iss"). Sirve para validar que el token lo emitimos nosotros.
victorino.jwt.issuer=victorino-style


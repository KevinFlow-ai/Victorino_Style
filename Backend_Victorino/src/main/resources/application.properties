# ===============================
#  JPA / HIBERNATE CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=update
# Mostrar las consultas SQL en consola
spring.jpa.show-sql=true

# Formatear las consultas SQL Para que las consultas se vean más bonita
spring.jpa.properties.hibernate.format_sql=true



# ¿Qué es spring.jpa.hibernate.ddl-auto?
# Es una propiedad de Spring Boot que le dice a Hibernate qué hacer con el esquema de la base de datos (tablas, columnas,
# relaciones) cada vez que arranca la aplicación.
# En otras palabras: controla si Hibernate crea, modifica, válida o ignora la estructura de la base de datos.
# Aquí se puede poner create-drop | create | update | validate | none

# create: Cada vez que arranca: borra todas las tablas y crea todoo desde cero. El riesgo borra datos
# create-drop: igual que create, pero al cerrar la aplicación, borra las tablas... El riesgo borra datos
# update: Hibérnate actualiza la base de datos automáticamente para que coincida con tus entidades:. Puede romper el esquema
# validate: Hibérnate solo comprueba que las entidades coinciden con la estructura de la base de datos.
# none: Hibérnate no toca la base de datos. Ideal cuando ya tienes el esquema creado manualmente o por migraciones





# Configuración nginx para la landing de Victorino Style.
# El ${PORT} lo sustituye envsubst al arrancar (lo inyecta Railway).

server {
    listen       ${PORT};
    listen       [::]:${PORT};
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    etag on;

    # Compresión para textos (HTML, CSS, JS, SVG). Imágenes ya están comprimidas.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Cabeceras de seguridad razonables para una landing estática.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Página principal: siempre revalida para servir la última versión.
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Imágenes (logo, hero, screenshots, favicon): cacheables 7 días.
    location ~* ^/assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # CSS y JS propios: revalidación con ETag (cambian poco pero pueden cambiar).
    location ~* ^/(css|js)/ {
        expires off;
        add_header Cache-Control "public, no-cache, must-revalidate";
    }

    location = /favicon.png {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Fallback general: si la ruta no existe, devolver index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
